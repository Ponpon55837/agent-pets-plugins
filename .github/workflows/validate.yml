name: Validate catalog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The validator and the data it compares against come from the base branch,
      # so a pull request cannot weaken the check that reviews it. This workflow file
      # itself comes from the pull request; "Check scope" rejects contributor changes to it.
      - name: Check out base (trusted validator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: tools
          persist-credentials: false

      - name: Check out pull request (data only, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tools/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install validator dependencies
        working-directory: tools
        run: pnpm install --frozen-lockfile

      - name: Validate pull request
        if: github.event_name == 'pull_request'
        working-directory: tools
        run: node scripts/validate-catalog.mjs --pr ../pr --base . --summary ../catalog-report.md

      - name: Validate catalog
        if: github.event_name != 'pull_request'
        working-directory: tools
        run: node scripts/validate-catalog.mjs --pr ../pr --summary ../catalog-report.md

      - name: Publish summary
        if: always()
        run: if [ -f catalog-report.md ]; then cat catalog-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      # "Post catalog report" turns this into a pull request comment.
      - name: Upload report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-report
          path: catalog-report.md
          if-no-files-found: ignore
          retention-days: 7
